[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scidiagnose"
version = "0.2.1"
description = "Minimal evidence-driven scientific computing diagnosis prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "langgraph>=1.2,<2"]

[project.scripts]
scidiagnose = "scidiagnose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
